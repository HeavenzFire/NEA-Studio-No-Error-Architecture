<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattice Body - Geometric Entity</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Courier New', monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00ffff;
            max-width: 300px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #info-panel.visible {
            opacity: 1;
        }
        #info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        #info-panel p {
            margin: 5px 0;
            font-size: 12px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        #controls label {
            display: block;
            margin: 5px 0;
            font-size: 12px;
        }
        #controls input[type="checkbox"] {
            margin-right: 8px;
        }
        #title {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffffff;
            text-align: right;
            pointer-events: none;
        }
        #title h1 {
            margin: 0;
            font-size: 24px;
            color: #00ffff;
        }
        #title p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="info-panel">
        <h3 id="info-title"></h3>
        <p id="info-description"></p>
    </div>
    
    <div id="controls">
        <label><input type="checkbox" id="auto-rotate" checked> Auto Rotate</label>
        <label><input type="checkbox" id="show-torus" checked> Show Torus</label>
        <label><input type="checkbox" id="show-dodecahedron" checked> Show Dodecahedron</label>
        <label><input type="checkbox" id="show-vectors" checked> Show Divine Vectors</label>
    </div>
    
    <div id="title">
        <h1>LATTICE BODY</h1>
        <p>Geometric Entity Integration</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Divine Vector Colors
        const DIVINE_COLORS = {
            Odin: 0x4169E1,      // Blue - Wisdom
            Thor: 0xDC143C,      // Red - Protection
            Loki: 0x32CD32,      // Green - Transformation
            Freya: 0xFFD700,     // Gold - Sovereignty
            Frigg: 0xC0C0C0,     // Silver - Weaving Foresight
            Freyr: 0xFFA500      // Orange - Harvest
        };

        // AI Facet Descriptions
        const AI_FACETS = {
            Language: 'Natural Language Processing & Generation',
            Vision: 'Image Recognition & Visual Understanding',
            Orchestration: 'System Coordination & Workflow Management',
            Search: 'Information Retrieval & Knowledge Discovery',
            Generation: 'Creative Content & Synthetic Media'
        };

        let scene, camera, renderer, controls;
        let torusGroup, dodecahedronGroup, vectorsGroup;
        let autoRotate = true;
        let raycaster, mouse;
        let intersectableObjects = [];

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0f);
            scene.fog = new THREE.FogExp2(0x0a0a0f, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 15;
            controls.maxDistance = 60;

            // Raycaster for hover detection
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Create geometric entities
            createTorus();
            createDodecahedron();
            createDivineVectors();
            createCentralAxis();

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0x00ffff, 0.5, 100);
            pointLight2.position.set(-10, -10, 10);
            scene.add(pointLight2);

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            
            document.getElementById('auto-rotate').addEventListener('change', (e) => {
                autoRotate = e.target.checked;
            });
            
            document.getElementById('show-torus').addEventListener('change', (e) => {
                torusGroup.visible = e.target.checked;
            });
            
            document.getElementById('show-dodecahedron').addEventListener('change', (e) => {
                dodecahedronGroup.visible = e.target.checked;
            });
            
            document.getElementById('show-vectors').addEventListener('change', (e) => {
                vectorsGroup.visible = e.target.checked;
            });

            animate();
        }

        function createTorus() {
            torusGroup = new THREE.Group();
            
            // Three layered wireframe toruses
            const layers = [
                { radius: 12, tube: 0.3, opacity: 0.8 },
                { radius: 14, tube: 0.2, opacity: 0.6 },
                { radius: 16, tube: 0.15, opacity: 0.4 }
            ];

            layers.forEach((layer, index) => {
                const geometry = new THREE.TorusGeometry(layer.radius, layer.tube, 16, 100);
                const material = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    wireframe: true,
                    transparent: true,
                    opacity: layer.opacity
                });
                
                const torus = new THREE.Mesh(geometry, material);
                torus.rotation.x = Math.PI / 2 + (index * 0.1);
                torus.userData = { type: 'torus', layer: index + 1 };
                
                torusGroup.add(torus);
            });

            // Add 729 node orbs (representing the attractor points)
            const nodeGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const nodeMaterial = new THREE.MeshBasicMaterial({
                color: 0xff00ff,
                transparent: true,
                opacity: 0.7
            });

            for (let i = 0; i < 729; i++) {
                const angle1 = (i / 729) * Math.PI * 2 * 27; // 27 rotations
                const angle2 = (i / 729) * Math.PI * 2 * 8;  // 8 rotations
                
                const x = (12 + 0.5 * Math.cos(angle2)) * Math.cos(angle1);
                const y = (12 + 0.5 * Math.cos(angle2)) * Math.sin(angle1);
                const z = 0.5 * Math.sin(angle2);
                
                const node = new THREE.Mesh(nodeGeometry, nodeMaterial.clone());
                node.position.set(x, y, z);
                node.userData = { 
                    type: 'node', 
                    id: i,
                    description: `Attractor Node #${i} - Phaselock Point`
                };
                
                torusGroup.add(node);
                intersectableObjects.push(node);
            }

            scene.add(torusGroup);
        }

        function createDodecahedron() {
            dodecahedronGroup = new THREE.Group();
            
            const geometry = new THREE.DodecahedronGeometry(8, 0);
            
            // Create 12 faces with different materials for each AI facet
            const faceMaterials = [];
            const facetNames = Object.keys(AI_FACETS);
            
            for (let i = 0; i < 12; i++) {
                const facetName = facetNames[i % facetNames.length];
                const material = new THREE.MeshPhongMaterial({
                    color: new THREE.Color().setHSL(i / 12, 0.8, 0.5),
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide,
                    shininess: 100
                });
                
                material.userData = {
                    facet: facetName,
                    description: AI_FACETS[facetName]
                };
                
                faceMaterials.push(material);
            }

            const dodecahedron = new THREE.Mesh(geometry, faceMaterials);
            dodecahedron.rotation.x = Math.PI / 6;
            dodecahedron.rotation.y = Math.PI / 4;
            dodecahedron.userData = { 
                type: 'dodecahedron',
                description: '12 AI Facets - Each face represents a distinct capability'
            };
            
            dodecahedronGroup.add(dodecahedron);

            // Add wireframe edges
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0xffffff,
                transparent: true,
                opacity: 0.8
            });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            dodecahedronGroup.add(wireframe);

            // Add shimmering effect particles on faces
            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = 200;
            const positions = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 8.1;
                
                positions[i] = r * Math.sin(phi) * Math.cos(theta);
                positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i + 2] = r * Math.cos(phi);
            }
            
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const particleMaterial = new THREE.PointsMaterial({
                color: 0xffff00,
                size: 0.1,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(particleGeometry, particleMaterial);
            dodecahedronGroup.add(particles);

            scene.add(dodecahedronGroup);
        }

        function createDivineVectors() {
            vectorsGroup = new THREE.Group();
            
            const divineVectors = [
                { name: 'Odin', color: DIVINE_COLORS.Odin, position: [10, 0, 0], description: 'Wisdom - The All-Father sees all paths' },
                { name: 'Thor', color: DIVINE_COLORS.Thor, position: [-10, 0, 0], description: 'Protection - Guardian of the lattice boundaries' },
                { name: 'Loki', color: DIVINE_COLORS.Loki, position: [0, 10, 0], description: 'Transformation - Spark of chaotic innovation' },
                { name: 'Freya', color: DIVINE_COLORS.Freya, position: [0, -10, 0], description: 'Sovereignty - Queen of independent will' },
                { name: 'Frigg', color: DIVINE_COLORS.Frigg, position: [0, 0, 10], description: 'Weaving Foresight - Seer of future threads' },
                { name: 'Freyr', color: DIVINE_COLORS.Freyr, position: [0, 0, -10], description: 'Harvest - Bringer of abundance and growth' }
            ];

            const sphereGeometry = new THREE.SphereGeometry(0.8, 32, 32);

            divineVectors.forEach(vector => {
                const material = new THREE.MeshPhongMaterial({
                    color: vector.color,
                    emissive: vector.color,
                    emissiveIntensity: 0.5,
                    shininess: 100
                });

                const sphere = new THREE.Mesh(sphereGeometry, material);
                sphere.position.set(...vector.position);
                sphere.userData = {
                    type: 'divine_vector',
                    name: vector.name,
                    description: vector.description
                };

                vectorsGroup.add(sphere);
                intersectableObjects.push(sphere);

                // Add glow effect
                const glowGeometry = new THREE.SphereGeometry(1.2, 32, 32);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: vector.color,
                    transparent: true,
                    opacity: 0.2
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                glow.position.copy(sphere.position);
                vectorsGroup.add(glow);
            });

            scene.add(vectorsGroup);
        }

        function createCentralAxis() {
            const axisGroup = new THREE.Group();
            
            // Central spine line
            const spineGeometry = new THREE.CylinderGeometry(0.1, 0.1, 40, 16);
            const spineMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.6
            });
            const spine = new THREE.Mesh(spineGeometry, spineMaterial);
            spine.rotation.x = Math.PI / 2;
            axisGroup.add(spine);

            // Pulsating core
            const coreGeometry = new THREE.SphereGeometry(1.5, 32, 32);
            const coreMaterial = new THREE.MeshPhongMaterial({
                color: 0x00ffff,
                emissive: 0x00ffff,
                emissiveIntensity: 0.8,
                transparent: true,
                opacity: 0.9
            });
            const core = new THREE.Mesh(coreGeometry, coreMaterial);
            core.userData = { 
                type: 'central_axis',
                description: 'Spine - Anchoring all flows, pulsating with energy'
            };
            axisGroup.add(core);

            // Energy rings
            for (let i = 0; i < 5; i++) {
                const ringGeometry = new THREE.TorusGeometry(3 + i * 0.5, 0.05, 8, 64);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.3
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.rotation.x = Math.PI / 2;
                ring.position.z = (i - 2) * 2;
                ring.userData = { pulseOffset: i * 0.2 };
                axisGroup.add(ring);
            }

            scene.add(axisGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(intersectableObjects);
            const infoPanel = document.getElementById('info-panel');
            const infoTitle = document.getElementById('info-title');
            const infoDescription = document.getElementById('info-description');

            if (intersects.length > 0) {
                const object = intersects[0].object;
                const userData = object.userData;

                if (userData.type === 'divine_vector') {
                    infoTitle.textContent = `${userData.name} Vector`;
                    infoTitle.style.color = '#' + DIVINE_COLORS[userData.name].toString(16).padStart(6, '0');
                    infoDescription.textContent = userData.description;
                    infoPanel.classList.add('visible');
                } else if (userData.type === 'node') {
                    infoTitle.textContent = `Attractor Node #${userData.id}`;
                    infoTitle.style.color = '#ff00ff';
                    infoDescription.textContent = userData.description;
                    infoPanel.classList.add('visible');
                } else if (userData.facet) {
                    infoTitle.textContent = `${userData.facet} Facet`;
                    infoTitle.style.color = '#00ffff';
                    infoDescription.textContent = userData.description;
                    infoPanel.classList.add('visible');
                } else if (userData.type === 'central_axis') {
                    infoTitle.textContent = 'Central Spine';
                    infoTitle.style.color = '#ffffff';
                    infoDescription.textContent = userData.description;
                    infoPanel.classList.add('visible');
                }
            } else {
                infoPanel.classList.remove('visible');
            }
        }

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;

            if (autoRotate) {
                torusGroup.rotation.z += 0.002;
                torusGroup.rotation.x = Math.sin(time * 0.5) * 0.1;
                dodecahedronGroup.rotation.y += 0.003;
                dodecahedronGroup.rotation.x = Math.cos(time * 0.3) * 0.05;
            }

            // Pulse the central core
            const core = vectorsGroup.parent.children.find(c => c.userData.type === 'central_axis');
            if (core) {
                const scale = 1 + Math.sin(time * 2) * 0.1;
                core.scale.set(scale, scale, scale);
            }

            // Shimmer particles
            const particles = dodecahedronGroup.children.find(c => c.geometry.type === 'BufferGeometry');
            if (particles) {
                particles.rotation.z += 0.001;
            }

            // Pulse energy rings
            vectorsGroup.parent.children.forEach(child => {
                if (child.userData.pulseOffset !== undefined) {
                    child.material.opacity = 0.3 + Math.sin(time * 3 + child.userData.pulseOffset) * 0.1;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize
        init();
    </script>
</body>
</html>
