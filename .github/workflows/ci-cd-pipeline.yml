name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '15'
  DATABASE_NAME: 'fpl_charity_care_test'
  DATABASE_USER: 'postgres'
  DATABASE_PASSWORD: 'postgres'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Test Job: Run unit tests and integration tests
  # ─────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ env.DATABASE_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov black flake8
      
      - name: Run linting checks
        run: |
          black --check fpl_engine/ scripts/
          flake8 fpl_engine/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 fpl_engine/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ env.DATABASE_USER }}; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      
      - name: Set up test database
        env:
          PGPASSWORD: ${{ env.DATABASE_PASSWORD }}
        run: |
          psql -h localhost -U ${{ env.DATABASE_USER }} -d ${{ env.DATABASE_NAME }} -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
      
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.DATABASE_USER }}:${{ env.DATABASE_PASSWORD }}@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          alembic upgrade head
      
      - name: Seed test data
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.DATABASE_USER }}:${{ env.DATABASE_PASSWORD }}@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          python scripts/seed_data.py << EOF
          yes
          EOF
      
      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.DATABASE_USER }}:${{ env.DATABASE_PASSWORD }}@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          pytest fpl_engine/tests/ -v --cov=fpl_engine --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
  
  # ─────────────────────────────────────────────────────────────
  # Health Check Job: Verify API endpoints and database connectivity
  # ─────────────────────────────────────────────────────────────
  health-check:
    runs-on: ubuntu-latest
    needs: test
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ env.DATABASE_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.DATABASE_USER }}:${{ env.DATABASE_PASSWORD }}@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          alembic upgrade head
      
      - name: Verify database schema
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.DATABASE_USER }}:${{ env.DATABASE_PASSWORD }}@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          
          async def verify():
              engine = create_async_engine('${{ env.DATABASE_URL }}')
              async with engine.connect() as conn:
                  # Check tables exist
                  tables = ['hospitals', 'federal_poverty_guidelines', 'hospital_fap_thresholds', 'families', 'eligibility_assessments']
                  for table in tables:
                      result = await conn.execute(text(f\"SELECT COUNT(*) FROM {table}\"))
                      count = result.scalar()
                      print(f'✓ Table {table}: {count} rows')
                  print('✓ All required tables present')
          
          asyncio.run(verify())
          "
  
  # ─────────────────────────────────────────────────────────────
  # Build Docker Image (on main branch only)
  # ─────────────────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/fpl-engine:latest
            ghcr.io/${{ github.repository }}/fpl-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  # ─────────────────────────────────────────────────────────────
  # Deploy to Staging (on main branch only)
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, health-check, build-docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          echo "✓ Deployment hooks would execute here"
          echo "  - Kubernetes manifest update"
          echo "  - Database migration execution"
          echo "  - Health check verification"
          echo "  - Rollback monitoring enabled"
      
      - name: Notify deployment status
        run: |
          echo "::notice::Deployment to staging completed successfully"
